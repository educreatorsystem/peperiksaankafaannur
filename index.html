<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Analisis Peperiksaan KAFA AN NUR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .nav-btn.active { background: #065f46; color: #fff; }
    .kafa-card { border: 1px solid #e5e7eb; background: #fff; border-radius: 8px; }
    .jawi-slip { font-family: "Times New Roman", "Scheherazade New", serif; direction: rtl; }
    .jawi-slip .latin { direction: ltr; unicode-bidi: isolate; font-family: Arial, sans-serif; }
    @media print {
      body { background: #fff; }
      body.print-slip * { visibility: hidden; }
      body.print-slip #slipPrintArea, body.print-slip #slipPrintArea * { visibility: visible; }
      body.print-slip #slipPrintArea { position: absolute; inset: 0; margin: 0; }
      .no-print { display: none !important; }
      .report-page { box-shadow: none !important; margin: 0 !important; width: 210mm !important; min-height: 297mm !important; }
      @page { size: A4 portrait; margin: 8mm; }
    }
  </style>
</head>
<body class="min-h-screen text-gray-900">
  <div id="loginView" class="min-h-screen flex items-center justify-center p-6 bg-emerald-900">
    <div class="w-full max-w-md bg-white rounded-lg shadow-xl p-6">
      <div class="text-center mb-6">
        <img id="loginLogo" class="w-24 h-24 object-contain mx-auto mb-3" alt="Lencana">
        <h1 class="text-2xl font-bold">KAFA AN NUR</h1>
        <p class="text-sm text-gray-500">Sistem Analisis Peperiksaan</p>
      </div>
      <div class="grid grid-cols-2 gap-2 mb-5">
        <button id="guruModeBtn" class="login-mode bg-emerald-700 text-white py-2 rounded font-semibold" onclick="setLoginMode('guru')">Guru</button>
        <button id="parentModeBtn" class="login-mode bg-gray-100 text-gray-700 py-2 rounded font-semibold" onclick="setLoginMode('ibu_bapa')">Ibu Bapa</button>
      </div>
      <div id="guruLoginBox">
        <label class="block text-sm font-semibold mb-1">Password Guru</label>
        <input id="guruPassword" type="password" class="w-full border rounded px-3 py-2 mb-4" placeholder="Masukkan password guru">
        <button onclick="loginGuru()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white rounded py-2 font-bold">Login Guru</button>
      </div>
      <div id="parentLoginBox" class="hidden">
        <label class="block text-sm font-semibold mb-1">No. Kad Pengenalan Murid</label>
        <input id="parentIc" type="text" class="w-full border rounded px-3 py-2 mb-4" placeholder="Contoh: 120101101234">
        <button onclick="loginParent()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white rounded py-2 font-bold">Lihat Slip</button>
      </div>
      <p id="loginMessage" class="text-sm text-red-600 mt-4 min-h-5"></p>
    </div>
  </div>

  <div id="appView" class="hidden min-h-screen">
    <aside class="fixed inset-y-0 left-0 w-64 bg-emerald-800 text-white no-print">
      <div class="p-5 border-b border-emerald-700 flex gap-3 items-center">
        <img id="sideLogo" class="w-12 h-12 object-contain bg-white rounded-full p-1" alt="Lencana">
        <div>
          <div class="font-bold leading-tight">KAFA AN NUR</div>
          <div class="text-xs text-emerald-200">Analisis Peperiksaan</div>
        </div>
      </div>
      <nav id="navMenu" class="p-3 space-y-1"></nav>
      <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-emerald-700">
        <button onclick="logout()" class="w-full bg-emerald-950 hover:bg-emerald-900 py-2 rounded text-sm">
          <i class="fa-solid fa-right-from-bracket mr-2"></i>Logout
        </button>
      </div>
    </aside>

    <main class="ml-64 min-h-screen">
      <header class="sticky top-0 z-10 bg-white border-b px-6 py-4 flex justify-between items-center no-print">
        <div>
          <h2 id="pageTitle" class="text-xl font-bold">Input Markah</h2>
          <p id="userInfo" class="text-sm text-gray-500"></p>
        </div>
        <button onclick="refreshData()" class="border rounded px-3 py-2 text-sm hover:bg-gray-50">
          <i class="fa-solid fa-rotate mr-1"></i>Segar Semula
        </button>
      </header>

      <section class="p-6 space-y-6">
        <div id="tab-input" class="tab-panel active"></div>
        <div id="tab-kelas" class="tab-panel"></div>
        <div id="tab-tahun" class="tab-panel"></div>
        <div id="tab-individu" class="tab-panel"></div>
        <div id="tab-subjek" class="tab-panel"></div>
        <div id="tab-slip" class="tab-panel"></div>
      </section>
    </main>
  </div>

  <script>
    const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz164qkC7FFofbJlZbcjPsL1igXr-RC8DRWvdYuOYSK2n7_2L_UuWzzPE4dBgnoJg190A/exec';

    const state = {
      role: null,
      sessionToken: null,
      students: [],
      subjects: [],
      pentaksiranList: [],
      kelasList: [],
      marks: {},
      settings: { schoolName: 'KAFA AN NUR', logoUrl: 'https://iili.io/nqIgmR2.md.jpg' },
      charts: {}
    };

    const tabsGuru = [
      ['tab-input', 'Input Markah', 'fa-pen-to-square'],
      ['tab-kelas', 'Analisis Kelas', 'fa-people-group'],
      ['tab-tahun', 'Analisis Tahun', 'fa-layer-group'],
      ['tab-individu', 'Individu', 'fa-user-graduate'],
      ['tab-subjek', 'Subjek', 'fa-chart-column'],
      ['tab-slip', 'Slip Jawi', 'fa-file-lines']
    ];
    const tabsParent = [['tab-slip', 'Slip Jawi', 'fa-file-lines']];

    document.getElementById('loginLogo').src = state.settings.logoUrl;

    function isAppsScriptRuntimeReady() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }

    function apiGet(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = 'kafaCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        const url = new URL(APP_SCRIPT_URL);
        url.searchParams.set('action', action);
        url.searchParams.set('callback', callbackName);
        Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('Endpoint Apps Script tidak memberi respons. Semak URL deployment /exec.'));
        }, 20000);

        function cleanup() {
          clearTimeout(timer);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = data => {
          cleanup();
          if (data && data.ok === false) reject(new Error(data.message || 'Permintaan gagal.'));
          else resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('Tidak dapat menghubungi Apps Script endpoint.'));
        };

        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    function apiPost(action, params = {}) {
      return new Promise(resolve => {
        const iframeName = 'kafa_post_' + Date.now();
        const iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.className = 'hidden';

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = APP_SCRIPT_URL;
        form.target = iframeName;
        form.className = 'hidden';

        const payload = Object.assign({ action }, params);
        Object.keys(payload).forEach(key => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = payload[key];
          form.appendChild(input);
        });

        document.body.appendChild(iframe);
        document.body.appendChild(form);
        form.submit();

        setTimeout(() => {
          form.remove();
          iframe.remove();
          resolve({ ok: true });
        }, 1800);
      });
    }

    function setLoginMode(mode) {
      document.getElementById('guruLoginBox').classList.toggle('hidden', mode !== 'guru');
      document.getElementById('parentLoginBox').classList.toggle('hidden', mode !== 'ibu_bapa');
      document.getElementById('guruModeBtn').className = mode === 'guru' ? activeLoginClass() : inactiveLoginClass();
      document.getElementById('parentModeBtn').className = mode === 'ibu_bapa' ? activeLoginClass() : inactiveLoginClass();
      document.getElementById('loginMessage').textContent = '';
    }

    function activeLoginClass() { return 'login-mode bg-emerald-700 text-white py-2 rounded font-semibold'; }
    function inactiveLoginClass() { return 'login-mode bg-gray-100 text-gray-700 py-2 rounded font-semibold'; }

    function loginGuru() {
      setLoginMessage('Sedang login...', false);
      if (isAppsScriptRuntimeReady()) {
        google.script.run
          .withSuccessHandler(handleLoginSuccess)
          .withFailureHandler(handleServerError)
          .loginGuru(document.getElementById('guruPassword').value);
        return;
      }

      apiGet('loginGuru', { password: document.getElementById('guruPassword').value })
        .then(handleLoginSuccess)
        .catch(handleServerError);
    }

    function loginParent() {
      setLoginMessage('Sedang menyemak No. Kad Pengenalan...', false);
      if (isAppsScriptRuntimeReady()) {
        google.script.run
          .withSuccessHandler(handleLoginSuccess)
          .withFailureHandler(handleServerError)
          .loginIbuBapa(document.getElementById('parentIc').value);
        return;
      }

      apiGet('loginIbuBapa', { noKadPengenalan: document.getElementById('parentIc').value })
        .then(handleLoginSuccess)
        .catch(handleServerError);
    }

    function handleLoginSuccess(data) {
      if (!data || !data.ok) {
        setLoginMessage(data && data.message ? data.message : 'Login gagal.', true);
        return;
      }
      hydrateState(data);
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');
      document.getElementById('sideLogo').src = state.settings.logoUrl;
      document.getElementById('userInfo').textContent = state.role === 'guru' ? 'Akses guru: semua fungsi' : 'Akses ibu bapa: slip murid sahaja';
      buildNav();
      buildAllPanels();
      switchTab(state.role === 'guru' ? 'tab-input' : 'tab-slip');
    }

    function hydrateState(data) {
      state.role = data.role;
      state.sessionToken = data.sessionToken || state.sessionToken;
      state.students = data.students || [];
      state.subjects = data.subjects || [];
      state.pentaksiranList = data.pentaksiranList || [];
      state.kelasList = data.kelasList || [];
      state.settings = data.settings || state.settings;
      state.marks = {};
      (data.marks || []).forEach(m => {
        state.marks[markKey(m.studentId, m.pentaksiran, m.subjek)] = String(m.markah || '').toUpperCase();
      });
    }

    function refreshData() {
      const onSuccess = data => {
        hydrateState(data);
        buildAllPanels();
        showToast('Data berjaya disegarkan.');
      };

      if (isAppsScriptRuntimeReady()) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(handleServerError)
          .refreshData(state.sessionToken);
        return;
      }

      apiGet('refreshData', { sessionToken: state.sessionToken })
        .then(onSuccess)
        .catch(handleServerError);
    }

    function buildNav() {
      const tabs = state.role === 'guru' ? tabsGuru : tabsParent;
      document.getElementById('navMenu').innerHTML = tabs.map(t => `
        <button class="nav-btn w-full text-left px-4 py-3 rounded hover:bg-emerald-700" data-tab="${t[0]}" onclick="switchTab('${t[0]}')">
          <i class="fa-solid ${t[2]} w-5 mr-2"></i>${t[1]}
        </button>
      `).join('');
    }

    function switchTab(id) {
      document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      const btn = document.querySelector(`.nav-btn[data-tab="${id}"]`);
      if (btn) {
        btn.classList.add('active');
        document.getElementById('pageTitle').textContent = btn.textContent.trim();
      }
      if (id === 'tab-slip') renderSlip();
    }

    function buildAllPanels() {
      if (state.role === 'guru') {
        buildInputPanel();
        buildAnalysisPanel('kelas');
        buildAnalysisPanel('tahun');
        buildIndividualPanel();
        buildSubjectPanel();
      }
      buildSlipPanel();
    }

    function buildInputPanel() {
      document.getElementById('tab-input').innerHTML = `
        <div class="kafa-card p-5">
          <div class="grid md:grid-cols-4 gap-4 items-end">
            ${selectHtml('imKelas', 'Kelas', state.kelasList, 'renderInputTable()')}
            ${selectHtml('imPentaksiran', 'Pentaksiran', state.pentaksiranList, 'renderInputTable()')}
            ${selectHtml('imSubjek', 'Subjek', state.subjects, 'renderInputTable()')}
            <button onclick="setAllTH()" class="border rounded px-4 py-2 hover:bg-gray-50"><i class="fa-solid fa-user-xmark mr-1"></i>Set Semua TH</button>
          </div>
        </div>
        <div id="inputTableWrap" class="kafa-card overflow-hidden"></div>
      `;
    }

    function renderInputTable() {
      const kelas = val('imKelas');
      const pentaksiran = val('imPentaksiran');
      const subjek = val('imSubjek');
      const wrap = document.getElementById('inputTableWrap');
      if (!kelas || !pentaksiran || !subjek) {
        wrap.innerHTML = '<div class="p-8 text-center text-gray-500">Sila pilih kelas, pentaksiran dan subjek.</div>';
        return;
      }
      const rows = state.students.filter(s => s.kelas === kelas);
      wrap.innerHTML = `
        <div class="p-4 bg-emerald-50 border-b flex justify-between items-center">
          <b>${escapeHtml(subjek)} - ${escapeHtml(kelas)}</b>
          <button onclick="saveMarks()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded">
            <i class="fa-solid fa-floppy-disk mr-1"></i>Simpan Markah
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-100">
              <tr><th class="p-3 w-16">Bil</th><th class="p-3 text-left">Nama Murid</th><th class="p-3">No. KP</th><th class="p-3">Markah /70</th><th class="p-3">Gred</th></tr>
            </thead>
            <tbody>${rows.map((s, i) => inputRowHtml(s, i, pentaksiran, subjek)).join('')}</tbody>
          </table>
        </div>
      `;
    }

    function inputRowHtml(student, i, pentaksiran, subjek) {
      const mark = state.marks[markKey(student.id, pentaksiran, subjek)] || '';
      const g = getGredAkademik(mark).gred;
      return `
        <tr class="border-t">
          <td class="p-3 text-center">${i + 1}</td>
          <td class="p-3 font-semibold">${escapeHtml(student.nama)}</td>
          <td class="p-3 text-center">${escapeHtml(student.noKp || '')}</td>
          <td class="p-3 text-center">
            <div class="inline-flex gap-2 items-center">
              <input data-student="${escapeAttr(student.id)}" value="${escapeAttr(mark)}" oninput="updateGradeCell(this)"
                class="mark-input w-20 border rounded px-2 py-1 text-center font-bold" placeholder="0-70">
              <button onclick="setTH('${escapeAttr(student.id)}')" class="px-2 py-1 text-xs rounded bg-orange-100 text-orange-800">TH</button>
            </div>
          </td>
          <td class="p-3 text-center font-bold grade-cell" id="grade_${escapeAttr(student.id)}">${g}</td>
        </tr>
      `;
    }

    function updateGradeCell(input) {
      let value = input.value.trim().toUpperCase();
      if (value !== 'TH') {
        value = value.replace(/[^0-9]/g, '');
        if (Number(value) > 70) value = '70';
        input.value = value;
      } else {
        input.value = value;
      }
      document.getElementById('grade_' + input.dataset.student).textContent = getGredAkademik(input.value).gred;
    }

    function setTH(studentId) {
      const input = document.querySelector(`.mark-input[data-student="${cssEscape(studentId)}"]`);
      if (input) {
        input.value = 'TH';
        updateGradeCell(input);
      }
    }

    function setAllTH() {
      document.querySelectorAll('.mark-input').forEach(input => {
        input.value = 'TH';
        updateGradeCell(input);
      });
    }

    function saveMarks() {
      const kelas = val('imKelas');
      const pentaksiran = val('imPentaksiran');
      const subjek = val('imSubjek');
      const rows = state.students.filter(s => s.kelas === kelas).map(s => {
        const input = document.querySelector(`.mark-input[data-student="${cssEscape(s.id)}"]`);
        return {
          studentId: s.id,
          nama: s.nama,
          kelas: s.kelas,
          noKp: s.noKp,
          pentaksiran,
          subjek,
          markah: input ? input.value.trim().toUpperCase() : ''
        };
      });

      const onSuccess = () => {
        rows.forEach(r => {
          const key = markKey(r.studentId, r.pentaksiran, r.subjek);
          if (r.markah) state.marks[key] = r.markah;
          else delete state.marks[key];
        });
        showToast('Markah berjaya dihantar ke Google Sheet.');
      };

      if (isAppsScriptRuntimeReady()) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(handleServerError)
          .simpanMarkah(state.sessionToken, rows);
        return;
      }

      apiPost('simpanMarkah', {
        sessionToken: state.sessionToken,
        records: JSON.stringify(rows)
      }).then(onSuccess);
    }

    function buildAnalysisPanel(type) {
      const target = type === 'kelas' ? 'tab-kelas' : 'tab-tahun';
      const title = type === 'kelas' ? 'Analisis Mengikut Kelas' : 'Analisis Mengikut Tahun';
      const selector = type === 'kelas'
        ? selectHtml('anKelas', 'Kelas', state.kelasList, "renderGradeAnalysis('kelas')")
        : selectHtml('anTahun', 'Tahun', getYearList(), "renderGradeAnalysis('tahun')");
      document.getElementById(target).innerHTML = `
        <div class="kafa-card p-5">
          <div class="grid md:grid-cols-3 gap-4 items-end">
            ${selectHtml(type === 'kelas' ? 'anKelasPentaksiran' : 'anTahunPentaksiran', 'Pentaksiran', state.pentaksiranList, "renderGradeAnalysis('" + type + "')")}
            ${selector}
          </div>
        </div>
        <div id="${type}AnalysisResult" class="space-y-5"></div>
      `;
    }

    function renderGradeAnalysis(type) {
      const pentaksiran = val(type === 'kelas' ? 'anKelasPentaksiran' : 'anTahunPentaksiran');
      const filterValue = val(type === 'kelas' ? 'anKelas' : 'anTahun');
      const resultId = type === 'kelas' ? 'kelasAnalysisResult' : 'tahunAnalysisResult';
      const result = document.getElementById(resultId);
      if (!pentaksiran || !filterValue) {
        result.innerHTML = '<div class="kafa-card p-8 text-center text-gray-500">Sila pilih maklumat analisis.</div>';
        return;
      }
      const students = type === 'kelas'
        ? state.students.filter(s => s.kelas === filterValue)
        : state.students.filter(s => getTahun(s.kelas) === filterValue);
      const analysis = buildGradeStats(students, pentaksiran);
      result.innerHTML = gradeAnalysisHtml(type, filterValue, pentaksiran, analysis);
      renderChart(type + 'Chart', ['A', 'B', 'C', 'D', 'TH'], ['A', 'B', 'C', 'D', 'TH'].map(g => analysis.total[g]), 'bar');
    }

    function gradeAnalysisHtml(type, label, pentaksiran, analysis) {
      return `
        <div class="grid lg:grid-cols-5 gap-3">
          ${['A','B','C','D','TH'].map(g => `<div class="kafa-card p-4 text-center"><div class="text-sm text-gray-500">Gred ${g}</div><div class="text-3xl font-bold">${analysis.total[g]}</div></div>`).join('')}
        </div>
        <div class="grid lg:grid-cols-2 gap-5">
          <div class="kafa-card p-4">
            <h3 class="font-bold mb-3">${type === 'kelas' ? 'Kelas' : 'Tahun'} ${escapeHtml(label)} - ${escapeHtml(pentaksiran)}</h3>
            <canvas id="${type}Chart" height="170"></canvas>
          </div>
          <div class="kafa-card overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-gray-100"><tr><th class="p-3 text-left">Subjek</th><th>A</th><th>B</th><th>C</th><th>D</th><th>TH</th><th>Jumlah Dinilai</th></tr></thead>
              <tbody>${analysis.bySubject.map(row => `
                <tr class="border-t"><td class="p-3 font-semibold">${escapeHtml(row.subjek)}</td><td class="text-center">${row.A}</td><td class="text-center">${row.B}</td><td class="text-center">${row.C}</td><td class="text-center">${row.D}</td><td class="text-center">${row.TH}</td><td class="text-center">${row.assessed}</td></tr>
              `).join('')}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function buildIndividualPanel() {
      document.getElementById('tab-individu').innerHTML = `
        <div class="kafa-card p-5">
          <div class="grid md:grid-cols-4 gap-4 items-end">
            ${selectHtml('inPentaksiran', 'Pentaksiran', state.pentaksiranList, 'populateStudentSelect(); renderIndividual()')}
            ${selectHtml('inKelas', 'Kelas', state.kelasList, 'populateStudentSelect(); renderIndividual()')}
            <div>
              <label class="block text-sm font-semibold mb-1">Murid</label>
              <select id="inStudent" class="w-full border rounded px-3 py-2" onchange="renderIndividual()"><option value="">-- Pilih --</option></select>
            </div>
          </div>
        </div>
        <div id="individualResult"></div>
      `;
    }

    function populateStudentSelect() {
      const kelas = val('inKelas');
      const students = state.students.filter(s => !kelas || s.kelas === kelas);
      document.getElementById('inStudent').innerHTML = '<option value="">-- Pilih --</option>' + students.map(s => `<option value="${escapeAttr(s.id)}">${escapeHtml(s.nama)}</option>`).join('');
    }

    function renderIndividual() {
      const pentaksiran = val('inPentaksiran');
      const student = state.students.find(s => s.id === val('inStudent'));
      const result = document.getElementById('individualResult');
      if (!pentaksiran || !student) {
        result.innerHTML = '<div class="kafa-card p-8 text-center text-gray-500">Sila pilih pentaksiran dan murid.</div>';
        return;
      }
      const rows = state.subjects.map(subjek => {
        const mark = state.marks[markKey(student.id, pentaksiran, subjek)] || '';
        return { subjek, mark, gred: getGredAkademik(mark).gred };
      });
      const assessed = rows.filter(r => r.mark);
      const total = assessed.reduce((sum, r) => sum + numericMark(r.mark), 0);
      result.innerHTML = `
        <div class="grid lg:grid-cols-2 gap-5">
          <div class="kafa-card overflow-hidden">
            <div class="p-4 bg-emerald-50 border-b"><b>${escapeHtml(student.nama)}</b><div class="text-sm text-gray-600">${escapeHtml(student.kelas)} | ${escapeHtml(pentaksiran)}</div></div>
            <table class="w-full text-sm">
              <thead class="bg-gray-100"><tr><th class="p-3 text-left">Subjek</th><th>Markah</th><th>Gred</th></tr></thead>
              <tbody>${rows.map(r => `<tr class="border-t"><td class="p-3 font-semibold">${escapeHtml(r.subjek)}</td><td class="text-center">${escapeHtml(r.mark)}</td><td class="text-center font-bold">${r.gred}</td></tr>`).join('')}</tbody>
              <tfoot><tr class="bg-gray-50 font-bold"><td class="p-3">Jumlah</td><td class="text-center">${total}</td><td></td></tr></tfoot>
            </table>
          </div>
          <div class="kafa-card p-4"><h3 class="font-bold mb-3">Carta Markah Individu</h3><canvas id="individualChart" height="220"></canvas></div>
        </div>
      `;
      renderChart('individualChart', rows.map(r => shortSubjek(r.subjek)), rows.map(r => numericMark(r.mark)), 'bar', 70);
    }

    function buildSubjectPanel() {
      document.getElementById('tab-subjek').innerHTML = `
        <div class="kafa-card p-5">
          <div class="grid md:grid-cols-4 gap-4 items-end">
            ${selectHtml('suPentaksiran', 'Pentaksiran', state.pentaksiranList, 'renderSubjectAnalysis()')}
            ${selectHtml('suScope', 'Skop', ['Semua', 'Kelas', 'Tahun'], 'renderSubjectAnalysis()')}
            ${selectHtml('suFilter', 'Kelas/Tahun', [], 'renderSubjectAnalysis()')}
            ${selectHtml('suSubjek', 'Subjek', state.subjects, 'renderSubjectAnalysis()')}
          </div>
        </div>
        <div id="subjectResult"></div>
      `;
      document.getElementById('suScope').addEventListener('change', updateSubjectFilter);
      updateSubjectFilter();
    }

    function updateSubjectFilter() {
      const scope = val('suScope');
      const options = scope === 'Kelas' ? state.kelasList : scope === 'Tahun' ? getYearList() : [];
      const el = document.getElementById('suFilter');
      el.innerHTML = '<option value="">-- Semua --</option>' + options.map(o => `<option value="${escapeAttr(o)}">${escapeHtml(o)}</option>`).join('');
      renderSubjectAnalysis();
    }

    function renderSubjectAnalysis() {
      const pentaksiran = val('suPentaksiran');
      const scope = val('suScope') || 'Semua';
      const filter = val('suFilter');
      const subjek = val('suSubjek');
      const result = document.getElementById('subjectResult');
      if (!pentaksiran || !subjek) {
        result.innerHTML = '<div class="kafa-card p-8 text-center text-gray-500">Sila pilih pentaksiran dan subjek.</div>';
        return;
      }
      let students = state.students;
      if (scope === 'Kelas' && filter) students = students.filter(s => s.kelas === filter);
      if (scope === 'Tahun' && filter) students = students.filter(s => getTahun(s.kelas) === filter);

      const stats = { A: 0, B: 0, C: 0, D: 0, TH: 0 };
      students.forEach(s => {
        const g = getGredAkademik(state.marks[markKey(s.id, pentaksiran, subjek)] || '').gred;
        if (stats[g] !== undefined) stats[g]++;
      });
      result.innerHTML = `
        <div class="grid lg:grid-cols-2 gap-5">
          <div class="kafa-card overflow-hidden">
            <div class="p-4 bg-emerald-50 border-b"><b>${escapeHtml(subjek)}</b><div class="text-sm text-gray-600">${escapeHtml(pentaksiran)} | ${escapeHtml(scope)} ${escapeHtml(filter)}</div></div>
            <table class="w-full text-sm">
              <thead class="bg-gray-100"><tr><th class="p-3">Gred</th><th>Bilangan</th><th>Peratus</th></tr></thead>
              <tbody>${['A','B','C','D','TH'].map(g => `<tr class="border-t"><td class="p-3 text-center font-bold">${g}</td><td class="text-center">${stats[g]}</td><td class="text-center">${percent(stats[g], students.length)}%</td></tr>`).join('')}</tbody>
            </table>
          </div>
          <div class="kafa-card p-4"><h3 class="font-bold mb-3">Carta Taburan Gred Subjek</h3><canvas id="subjectChart" height="220"></canvas></div>
        </div>
      `;
      renderChart('subjectChart', ['A','B','C','D','TH'], ['A','B','C','D','TH'].map(g => stats[g]), 'bar');
    }

    function buildSlipPanel() {
      const isParent = state.role === 'ibu_bapa';
      document.getElementById('tab-slip').innerHTML = `
        <div class="kafa-card p-5 no-print">
          <div class="grid md:grid-cols-4 gap-4 items-end">
            ${isParent ? '' : selectHtml('slKelas', 'Kelas', state.kelasList, 'populateSlipStudents(); renderSlip()')}
            ${selectHtml('slPentaksiran', 'Pentaksiran', state.pentaksiranList, 'renderSlip()')}
            ${isParent ? '' : '<div><label class="block text-sm font-semibold mb-1">Murid</label><select id="slStudent" class="w-full border rounded px-3 py-2" onchange="renderSlip()"></select></div>'}
            <button onclick="printSlip()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded"><i class="fa-solid fa-print mr-1"></i>Cetak Slip</button>
          </div>
        </div>
        <div id="slipPrintArea" class="flex justify-center"></div>
      `;
      if (!isParent) populateSlipStudents();
      renderSlip();
    }

    function populateSlipStudents() {
      const kelas = val('slKelas');
      const students = state.students.filter(s => !kelas || s.kelas === kelas);
      const el = document.getElementById('slStudent');
      if (!el) return;
      el.innerHTML = '<option value="">-- Pilih Murid --</option>' + students.map(s => `<option value="${escapeAttr(s.id)}">${escapeHtml(s.nama)}</option>`).join('');
    }

    function renderSlip() {
      const pentaksiran = val('slPentaksiran');
      let student = null;
      if (state.role === 'ibu_bapa') student = state.students[0];
      else student = state.students.find(s => s.id === val('slStudent'));
      const area = document.getElementById('slipPrintArea');
      if (!area) return;
      if (!pentaksiran || !student) {
        area.innerHTML = '<div class="kafa-card p-8 text-center text-gray-500 w-full">Sila pilih pentaksiran dan murid.</div>';
        return;
      }
      area.innerHTML = slipHtml(student, pentaksiran);
    }

    function slipHtml(student, pentaksiran) {
      const rows = state.subjects.map((subjek, i) => {
        const mark = state.marks[markKey(student.id, pentaksiran, subjek)] || '';
        const g = getGredAkademik(mark).gred;
        return { bil: i + 1, subjek, mark, gred: g };
      });
      const total = rows.reduce((sum, r) => sum + numericMark(r.mark), 0);
      const max = rows.length * 70;
      const percentValue = max ? (total / max * 100) : 0;
      const overall = getOverallGradeByPercent(percentValue);
      const rankClass = getRank(student, pentaksiran, 'kelas');
      const rankYear = getRank(student, pentaksiran, 'tahun');
      return `
        <div class="report-page jawi-slip bg-white w-[210mm] min-h-[297mm] shadow-lg p-8 text-black border-[6px] border-double border-black">
          <div class="text-center mb-3">
            <img src="${escapeAttr(state.settings.logoUrl)}" class="w-20 h-20 object-contain mx-auto mb-1" alt="Lencana">
            <div class="latin text-xl font-bold">${escapeHtml(state.settings.schoolName || 'KAFA AN NUR')}</div>
            <div class="text-3xl font-bold mt-1">ڤڠرکسأن ${escapeHtml(toJawiPentaksiran(pentaksiran))}</div>
          </div>
          <div class="grid grid-cols-2 gap-4 text-xl mb-4">
            <div class="border border-black px-3 py-2">تاهون : <span class="latin font-bold">${escapeHtml(getTahun(student.kelas) || '')}</span></div>
            <div class="border border-black px-3 py-2">کلس : <span class="latin font-bold">${escapeHtml(student.kelas)}</span></div>
          </div>
          <div class="border border-black px-3 py-2 text-xl mb-4">نام موريد : <span class="latin font-bold">${escapeHtml(student.nama)}</span></div>
          <table class="w-full border-collapse text-xl mb-4">
            <thead>
              <tr>
                <th class="border border-black p-2 w-16">بيل</th>
                <th class="border border-black p-2">مات ڤلاجرن</th>
                <th class="border border-black p-2 w-24">مرکه</th>
                <th class="border border-black p-2 w-24">ݢريد</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td class="border border-black p-2 text-center latin">${r.bil}</td>
                  <td class="border border-black p-2">${escapeHtml(toJawiSubject(r.subjek))}</td>
                  <td class="border border-black p-2 text-center latin">${escapeHtml(r.mark)}</td>
                  <td class="border border-black p-2 text-center latin font-bold">${escapeHtml(r.gred)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <table class="w-full border-collapse text-xl mb-10">
            <tr>
              <td class="border border-black p-2">کدودوقن دالم کلس</td>
              <td class="border border-black p-2 text-center latin">${rankClass.rank} / ${rankClass.total}</td>
              <td class="border border-black p-2">کدودوقن دالم درجه</td>
              <td class="border border-black p-2 text-center latin">${rankYear.rank} / ${rankYear.total}</td>
            </tr>
            <tr>
              <td class="border border-black p-2">جمله مرکه</td>
              <td class="border border-black p-2 text-center latin">${total} / ${max}</td>
              <td class="border border-black p-2">ڤراتوس</td>
              <td class="border border-black p-2 text-center latin">${percentValue.toFixed(1)}% (${overall})</td>
            </tr>
          </table>
          <div class="text-2xl text-center mb-8 underline">اولسن ݢورو</div>
          <div class="border-b border-dotted border-black h-10 mb-16"></div>
          <div class="grid grid-cols-3 gap-8 text-center text-xl mt-auto">
            <div><div class="border-b border-dotted border-black h-12 mb-2"></div><div>تندا تاڠن<br>ݢورو بسر</div></div>
            <div><div class="border-b border-dotted border-black h-12 mb-2"></div><div>تندا تاڠن ݢورو</div></div>
            <div><div class="border-b border-dotted border-black h-12 mb-2"></div><div>تندا تاڠن<br>ڤنجاݢ</div></div>
          </div>
        </div>
      `;
    }

    function printSlip() {
      document.body.classList.add('print-slip');
      window.print();
      setTimeout(() => document.body.classList.remove('print-slip'), 500);
    }

    function buildGradeStats(students, pentaksiran) {
      const total = { A: 0, B: 0, C: 0, D: 0, TH: 0 };
      const bySubject = state.subjects.map(subjek => {
        const row = { subjek, A: 0, B: 0, C: 0, D: 0, TH: 0, assessed: 0 };
        students.forEach(s => {
          const g = getGredAkademik(state.marks[markKey(s.id, pentaksiran, subjek)] || '').gred;
          if (row[g] !== undefined) {
            row[g]++;
            total[g]++;
            if (g !== 'TH') row.assessed++;
          }
        });
        return row;
      });
      return { total, bySubject };
    }

    function getRank(student, pentaksiran, scope) {
      const pool = state.students.filter(s => scope === 'kelas' ? s.kelas === student.kelas : getTahun(s.kelas) === getTahun(student.kelas));
      const ranked = pool.map(s => ({
        id: s.id,
        total: state.subjects.reduce((sum, subjek) => sum + numericMark(state.marks[markKey(s.id, pentaksiran, subjek)]), 0)
      })).sort((a, b) => b.total - a.total);
      return { rank: ranked.findIndex(r => r.id === student.id) + 1, total: pool.length };
    }

    function getGredAkademik(markah) {
      const value = String(markah || '').trim().toUpperCase();
      if (!value) return { gred: '', tafsiran: '' };
      if (value === 'TH') return { gred: 'TH', tafsiran: 'TIDAK HADIR' };
      const n = Number(value);
      if (Number.isNaN(n)) return { gred: '', tafsiran: '' };
      if (n >= 53) return { gred: 'A', tafsiran: 'CEMERLANG' };
      if (n >= 35) return { gred: 'B', tafsiran: 'BAIK' };
      if (n >= 17) return { gred: 'C', tafsiran: 'MEMUASKAN' };
      return { gred: 'D', tafsiran: 'PERLU BIMBINGAN' };
    }

    function getOverallGradeByPercent(pct) {
      const scaled = Math.round((pct / 100) * 70);
      return getGredAkademik(scaled).gred;
    }

    function numericMark(markah) {
      const value = String(markah || '').trim().toUpperCase();
      if (!value || value === 'TH') return 0;
      const n = Number(value);
      return Number.isNaN(n) ? 0 : n;
    }

    function renderChart(id, labels, data, type, max) {
      if (state.charts[id]) state.charts[id].destroy();
      const ctx = document.getElementById(id);
      if (!ctx) return;
      state.charts[id] = new Chart(ctx, {
        type,
        data: { labels, datasets: [{ label: 'Bilangan / Markah', data, backgroundColor: ['#047857','#2563eb','#d97706','#dc2626','#6b7280','#7c3aed','#0891b2'] }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: max || undefined } } }
      });
    }

    function selectHtml(id, label, options, onchange) {
      return `
        <div>
          <label class="block text-sm font-semibold mb-1">${label}</label>
          <select id="${id}" class="w-full border rounded px-3 py-2" onchange="${onchange || ''}">
            <option value="">-- Pilih --</option>
            ${(options || []).map(o => `<option value="${escapeAttr(o)}">${escapeHtml(o)}</option>`).join('')}
          </select>
        </div>
      `;
    }

    function val(id) {
      const el = document.getElementById(id);
      return el ? el.value : '';
    }

    function getYearList() {
      return Array.from(new Set(state.students.map(s => getTahun(s.kelas)).filter(Boolean))).sort();
    }

    function getTahun(kelas) {
      const match = String(kelas || '').match(/[1-6]/);
      return match ? match[0] : '';
    }

    function markKey(studentId, pentaksiran, subjek) {
      return [studentId, pentaksiran, subjek].map(x => String(x || '').trim().toLowerCase()).join('|');
    }

    function percent(n, total) {
      return total ? ((n / total) * 100).toFixed(1) : '0.0';
    }

    function shortSubjek(subjek) {
      return String(subjek || '').replace('Bahasa ', 'B.').replace('Pendidikan ', 'P.');
    }

    function toJawiPentaksiran(text) {
      const lower = String(text || '').toLowerCase();
      if (lower.includes('pertengahan')) return 'ڤرتڠهن تاهون';
      if (lower.includes('akhir')) return 'اخير تاهون';
      return text;
    }

    function toJawiSubject(subject) {
      const key = String(subject || '').toLowerCase();
      const map = [
        ['quran', 'القرآن'], ['قرآن', 'القرآن'], ['ibadah', 'عباده'], ['عبادة', 'عباده'],
        ['aqidah', 'عقيدة'], ['akidah', 'عقيدة'], ['sirah', 'سيره'], ['سيرة', 'سيره'],
        ['adab', 'ادب'], ['jawi', 'جاوي دان خط'], ['khat', 'جاوي دان خط'],
        ['lughah', 'لغة القرآن'], ['lughat', 'لغة القرآن'], ['bahasa arab', 'لغة القرآن'],
        ['akhlak', 'اخلاق'], ['tajwid', 'تجويد']
      ];
      const found = map.find(pair => key.includes(pair[0]));
      return found ? found[1] : subject;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/"/g, '\\"');
    }

    function setLoginMessage(message, isError) {
      const el = document.getElementById('loginMessage');
      el.textContent = message;
      el.className = 'text-sm mt-4 min-h-5 ' + (isError ? 'text-red-600' : 'text-gray-600');
    }

    function handleServerError(error) {
      const message = error && error.message ? error.message : String(error || 'Ralat tidak diketahui.');
      if (!document.getElementById('loginView').classList.contains('hidden')) setLoginMessage(message, true);
      else showToast(message, true);
    }

    function showToast(message, isError) {
      alert(message);
    }

    function logout() {
      state.sessionToken = null;
      state.role = null;
      document.getElementById('appView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
    }
  </script>
</body>
</html>
