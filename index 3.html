<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAFA AN NUR • Analisis Peperiksaan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#173c32;font:14px Inter,Arial,sans-serif}header{background:#075c46;color:white;padding:20px 5%;display:flex;align-items:center;gap:16px}header img{width:64px;height:64px;object-fit:contain;background:white;border-radius:50%}h1{font-size:23px;margin:0 0 6px}h2{font-size:20px}main{max-width:1250px;margin:26px auto;padding:0 20px}section,.card{background:white;border:1px solid #dce7e1;border-radius:14px;padding:24px;margin-bottom:20px}#login{max-width:440px;margin:60px auto}label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}input,select,textarea,button{font:inherit;border:1px solid #bccdc4;border-radius:7px;padding:10px}input,select{max-width:100%}button{cursor:pointer;background:#087354;color:white;border:0}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#e5f0eb;color:#164a39}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}nav button.active{background:#173c32;box-shadow:0 3px 0 #d2aa51}.filters{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}.filters>div{flex:1;min-width:140px}.filters select{width:100%}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d7e2dc;padding:10px;text-align:center}th{background:#edf4f0}td.name{text-align:left}small,.muted{color:#65796f}#message{white-space:pre-wrap;margin:14px 0;color:#975121}#status{margin-left:auto;font-size:12px}.grade{font-weight:700}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.summary span{background:#eff5f2;padding:12px;border-radius:8px}.bars{display:grid;gap:12px;margin:20px 0}.barrow{display:grid;grid-template-columns:50px 1fr 80px;align-items:center;gap:10px}.track{background:#e8efeb;height:24px;border-radius:4px;overflow:hidden}.bar{background:#159771;height:100%;min-width:0}.slip{direction:rtl;font-family:'Noto Naskh Arabic',serif;background:white;color:#111;border:5px double #111;padding:9mm;width:190mm;min-height:270mm;margin:20px auto;page-break-after:always;position:relative}.slip:last-child{page-break-after:auto}.slip h2,.slip h3{text-align:center;margin:5px;font-size:23px}.slip .logo{height:48px;display:block;margin:auto}.slip table{margin:12px 0;font-size:18px}.slip td,.slip th{border:1px solid #111;padding:7px;background:white}.slip .meta{display:flex;justify-content:space-between;font-size:18px;gap:12px}.slip .comment{min-height:33mm;border-bottom:1px dotted #111;font-size:20px;white-space:pre-wrap}.signs{display:flex;justify-content:space-between;margin-top:24mm;text-align:center;font-size:18px;gap:15px}.signs>div{border-top:1px dotted #111;padding-top:10px;width:30%}.ltr{direction:ltr;unicode-bidi:isolate}.slipwrap{overflow:auto}.print-title{display:none}#printArea{display:none}#editor input{width:95px}#editor textarea{width:100%;min-width:180px}a{color:#087354}@media(max-width:600px){header{padding:15px}h1{font-size:19px}main{padding:0 10px}section{padding:14px}.filters>div{min-width:120px}.slip{margin:10px 0}#status{display:none}}@media print{body>*{display:none!important}#printArea{display:block!important}body{background:white;color:black}#printArea .slip{margin:0 auto;width:100%;height:275mm;min-height:0;break-inside:avoid}#printArea table{font-size:11px}#printArea .slip table{font-size:18px}.print-title{display:block}#printArea .bars{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style><style id="pageRule">@page{size:A4 portrait;margin:10mm}</style></head><body>
<header><img src="https://iili.io/nqIgmR2.md.jpg" alt="Lencana KAFA AN NUR"><div><h1>KAFA AN NUR</h1><div>Sistem Analisis Peperiksaan</div></div><span id="status"></span></header>
<main><section id="login"><h2>Log masuk</h2><p class="muted">Pilih akses guru atau ibu bapa.</p><form id="loginForm"><label for="role">Jenis akses</label><select id="role" style="width:100%" onchange="loginMode()"><option value="guru">Guru</option><option value="parent">Ibu bapa</option></select><p><label id="credentialLabel" for="credential">Kata laluan guru</label><input id="credential" type="password" required style="width:100%" autocomplete="current-password"></p><button id="loginBtn" style="width:100%">Log masuk</button></form></section>
<div id="message" role="status" aria-live="polite"></div><div id="app" hidden><nav id="nav"></nav><section><div class="filters" id="filters"></div><div id="view"></div></section></div></main><div id="printArea"></div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbz164qkC7FFofbJlZbcjPsL1igXr-RC8DRWvdYuOYSK2n7_2L_UuWzzPE4dBgnoJg190A/exec';
let token='',role='',data={students:[],subjects:[],exams:[],records:[],ranks:{},jawi:{}},tab='marks',map=new Map(),dirty=false;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(id,ex,sub,kind='akademik')=>JSON.stringify([id,ex,sub,kind]);
const mark=(id,ex,sub='',kind='akademik')=>map.get(key(id,ex,sub,kind))??'';
function grade(v){if(v==='TH')return 'TH';if(v===''||v===null||v===undefined)return '—';const n=Number(v);if(!Number.isInteger(n)||n<0||n>70)return 'Tidak sah';return n>=53?'A':n>=35?'B':n>=17?'C':n>=1?'D':'Belum ditetapkan';}
function score(id,ex){const vals=data.subjects.map(s=>mark(id,ex,s)),total=vals.reduce((a,v)=>a+(Number(v)||0),0),complete=vals.every(v=>v!==''&&v!=='TH'&&Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<=70);return {total,complete,pct:data.subjects.length?total/(data.subjects.length*70)*100:0,attended:vals.filter(v=>v!==''&&v!=='TH').length};}
function rank(st,ex,scope){if(role==='parent')return data.ranks[ex]?.[scope]??'—';const own=score(st.id,ex);if(!own.complete)return '—';return 1+data.students.filter(s=>s[scope]===st[scope]).map(s=>score(s.id,ex)).filter(s=>s.complete&&s.total>own.total).length;}
async function api(action,args={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{const res=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,token,...args}),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);let r;try{r=await res.json();}catch{throw Error('Respons Apps Script bukan JSON. Pastikan versi baharu dideploy dan akses Anyone.');}if(r.status!=='success')throw Error(r.message||'Permintaan gagal');return r;}finally{clearTimeout(timer);}}
function notify(s){$('message').textContent=s;}
function loginMode(){$('credential').value='';const p=$('role').value==='parent';$('credential').type=p?'text':'password';$('credential').inputMode=p?'numeric':'text';$('credentialLabel').textContent=p?'No kad pengenalan murid (12 digit)':'Kata laluan guru';}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;notify('Menyemak akses…');try{const r=await api('login',{role:$('role').value,password:$('role').value==='guru'?$('credential').value:undefined,ic:$('role').value==='parent'?$('credential').value:undefined});token=r.token;role=r.role;await reload();$('credential').value='';$('login').hidden=true;$('app').hidden=false;tab=role==='guru'?'marks':'slip';navigation();render();notify('');}catch(err){token='';notify('Log masuk gagal: '+err.message);}finally{$('loginBtn').disabled=false;}};
async function reload(){const r=await api('load');data=r;map=new Map(r.records.map(x=>[key(x.id,x.pentaksiran,x.subjek,x.jenis),x.markah]));$('status').textContent='Data Google Sheet • '+new Date().toLocaleTimeString('ms-MY');}
async function logout(){if(dirty&&!confirm('Perubahan belum disimpan. Keluar?'))return;try{await api('logout');}catch{}token='';role='';data={students:[],subjects:[],exams:[],records:[],ranks:{},jawi:{}};map.clear();$('app').hidden=true;$('login').hidden=false;$('view').innerHTML='';$('printArea').innerHTML='';$('status').textContent='';dirty=false;notify('');}
function navigation(){const tabs=role==='guru'?[['marks','Input Markah'],['sahsiah','Sahsiah'],['details','Butiran Slip'],['analysis','Analisis Gred'],['individual','Analisis Individu'],['slip','Slip Jawi']]:[['slip','Slip Pencapaian']];$('nav').innerHTML=tabs.map(([t,l])=>`<button data-tab="${t}" class="${tab===t?'active':''}">${l}</button>`).join('')+'<button id="refresh" class="secondary">Muat semula</button><button id="logout" class="secondary">Log keluar</button>';$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(dirty&&!confirm('Perubahan belum disimpan. Tukar halaman?'))return;dirty=false;tab=b.dataset.tab;navigation();render();});$('logout').onclick=logout;$('refresh').onclick=async()=>{if(dirty&&!confirm('Muat semula dan buang perubahan belum disimpan?'))return;try{await reload();dirty=false;render();notify('Data terkini dimuat semula.');}catch(e){notify(e.message);}};}
function select(id,label,items,all){return `<div><label for="${id}">${label}</label><select id="${id}">${all?`<option value="">${all}</option>`:''}${items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`;}
function render(){const classes=[...new Set(data.students.map(s=>s.kelas))].sort(),years=[...new Set(data.students.map(s=>s.tahun))].sort();$('filters').innerHTML=select('exam','Pentaksiran',data.exams)+(role==='guru'?select('year','Tahun',years,'Semua tahun')+select('class','Kelas',classes,['analysis','individual','slip'].includes(tab)?'Semua kelas':null):'')+(['marks','analysis'].includes(tab)?select('subject','Subjek',data.subjects,tab==='analysis'?'Semua subjek':null):'')+(['individual','slip'].includes(tab)&&role==='guru'?'<div><label for="student">Murid</label><select id="student"></select></div>':'');
 $('filters').querySelectorAll('select').forEach(el=>el.onchange=()=>{if(dirty&&!confirm('Perubahan belum disimpan. Tukar pilihan?')){el.value=el.dataset.previous;return;}dirty=false;el.dataset.previous=el.value;if(el.id==='year'){const filtered=classes.filter(c=>!$('year').value||data.students.some(s=>s.kelas===c&&s.tahun===$('year').value));$('class').innerHTML=(['analysis','individual','slip'].includes(tab)?'<option value="">Semua kelas</option>':'')+filtered.map(c=>`<option>${esc(c)}</option>`).join('');}if(el.id==='year'||el.id==='class')studentSelect();draw();});$('filters').querySelectorAll('select').forEach(el=>el.dataset.previous=el.value);studentSelect();draw();}
function pool(){return data.students.filter(s=>(!$('year')?.value||s.tahun===$('year').value)&&(!$('class')?.value||s.kelas===$('class').value));}
function studentSelect(){if(!$('student'))return;$('student').innerHTML='<option value="">Semua murid</option>'+pool().map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');}
function chosen(){return pool().filter(s=>!$('student')?.value||s.id===$('student').value);}
function heading(t){return `<h2>${t}</h2><p class="muted">${esc($('exam').value)} · ${esc($('class')?.value||$('year')?.value||'Keseluruhan')}</p>`;}
function draw(){notify('');if(['marks','sahsiah','details'].includes(tab)){editor();return;}if(tab==='analysis'){analysis();return;}if(tab==='individual'){individual();return;}slips();}
function editor(){const ex=$('exam').value,sub=$('subject')?.value||'',kind=tab==='marks'?'akademik':tab==='sahsiah'?'sahsiah':'details';$('view').innerHTML=heading(tab==='marks'?'Input Markah Akademik':tab==='sahsiah'?'Input Sahsiah':'Kehadiran dan Ulasan Guru')+(tab==='marks'?'<p>A: 53–70 · B: 35–52 · C: 17–34 · D: 01–16 · TH: Tidak hadir.<br><small>0: gred belum ditetapkan. Kosong: belum diisi. Markah bulat sahaja.</small></p>':'')+`<div class="scroll"><table id="editor"><thead><tr><th>Bil</th><th>Nama murid</th>${kind==='details'?'<th>Kehadiran (hadir/jumlah)</th><th>Ulasan dalam Jawi</th>':'<th>Markah</th><th>Gred / Tafsiran</th>'}</tr></thead><tbody>${pool().map((s,i)=>`<tr data-id="${esc(s.id)}"><td>${i+1}</td><td class="name">${esc(s.name)}</td>${kind==='details'?`<td><input aria-label="Kehadiran ${esc(s.name)}" data-kind="kehadiran" placeholder="90/100" value="${esc(mark(s.id,ex,'','kehadiran'))}"></td><td><textarea dir="rtl" aria-label="Ulasan ${esc(s.name)}" data-kind="ulasan">${esc(mark(s.id,ex,'','ulasan'))}</textarea></td>`:`<td><input aria-label="Markah ${esc(s.name)}" data-kind="${kind}" value="${esc(mark(s.id,ex,sub,kind))}" inputmode="text"></td><td class="grade">${kind==='akademik'?grade(mark(s.id,ex,sub)):sahsiahGrade(mark(s.id,ex,'','sahsiah'))}</td>`}</tr>`).join('')}</tbody></table></div><p><button id="save">Simpan ke Google Sheet</button></p>`;$('editor').oninput=e=>{dirty=true;if(e.target.dataset.kind==='akademik')e.target.closest('tr').querySelector('.grade').textContent=grade(e.target.value.trim().toUpperCase());if(e.target.dataset.kind==='sahsiah')e.target.closest('tr').querySelector('.grade').textContent=sahsiahGrade(e.target.value);};$('save').onclick=async()=>{const records=[];let valid=true;$('editor').querySelectorAll('tr[data-id]').forEach(tr=>tr.querySelectorAll('[data-kind]').forEach(input=>{const k=input.dataset.kind,v=k==='ulasan'?input.value:input.value.trim().toUpperCase();if(k==='akademik'&&v!==''&&v!=='TH'&&(!/^\d+$/.test(v)||+v>70)){valid=false;input.style.borderColor='red';}if(k==='sahsiah'&&v!==''&&(!/^\d+$/.test(v)||+v>100)){valid=false;input.style.borderColor='red';}records.push({id:tr.dataset.id,pentaksiran:ex,subjek:k==='akademik'?sub:'',jenis:k,markah:v});}));if(!valid){notify('Semak markah berwarna merah. Akademik 0–70/TH; sahsiah 0–100.');return;}$('save').disabled=true;notify('Menyimpan…');try{await api('save',{records});records.forEach(r=>map.set(key(r.id,r.pentaksiran,r.subjek,r.jenis),r.markah));dirty=false;notify('Rekod berjaya disimpan ke Google Sheet.');}catch(e){notify('Simpanan belum disahkan: '+e.message+'\nMuat semula untuk semak sebelum mencuba lagi.');}finally{$('save').disabled=false;}};}
function sahsiahGrade(v){if(v==='')return '—';const n=Number(v);return !Number.isInteger(n)||n<0||n>100?'Tidak sah':n>=80?'MUMTAZ':n>=65?'JAYYID JIDDAN':n>=50?'JAYYID':n>=40?'MAQBUL':'RASIB';}
const grades=['A','B','C','D','TH'];
function counts(ss,subs,ex){const c={A:0,B:0,C:0,D:0,TH:0,blank:0,zero:0,invalid:0};ss.forEach(s=>subs.forEach(sub=>{const g=grade(mark(s.id,ex,sub));if(grades.includes(g))c[g]++;else if(g==='—')c.blank++;else if(g==='Belum ditetapkan')c.zero++;else c.invalid++;}));return c;}
function barChart(c){const total=grades.reduce((a,g)=>a+c[g],0);return `<div class="bars" role="img" aria-label="Carta taburan gred">${grades.map(g=>`<div class="barrow"><b>${g}</b><div class="track"><div class="bar" style="width:${total?100*c[g]/total:0}%"></div></div><span>${c[g]} (${total?(100*c[g]/total).toFixed(1):'0.0'}%)</span></div>`).join('')}</div>`;}
function analysis(){const ex=$('exam').value,ss=pool(),subs=$('subject').value?[$('subject').value]:data.subjects,c=counts(ss,subs,ex);const rows=(groups)=>groups.map(([label,people,subjects])=>{const n=counts(people,subjects,ex);return `<tr><td class="name">${esc(label)}</td>${grades.map(g=>`<td>${n[g]}</td>`).join('')}<td>${n.blank}</td><td>${n.zero+n.invalid}</td></tr>`;}).join('');const table=(title,groups)=>`<h3>${title}</h3><div class="scroll"><table><tr><th>Kumpulan</th>${grades.map(g=>`<th>${g}</th>`).join('')}<th>Belum diisi</th><th>Tiada gred</th></tr>${rows(groups)}</table></div>`;$('view').innerHTML=`<div id="report">${heading('Analisis Taburan Gred')}<p>${ss.length} murid · ${subs.length} subjek. Bilangan ialah rekod murid–subjek; peratus carta menggunakan jumlah A+B+C+D+TH.</p>${barChart(c)}<p>Belum diisi: ${c.blank} · Markah 0: ${c.zero} · Tidak sah: ${c.invalid}</p>${table('Mengikut kelas',[...new Set(ss.map(s=>s.kelas))].map(k=>[k,ss.filter(s=>s.kelas===k),subs]))}${table('Mengikut tahun',[...new Set(ss.map(s=>s.tahun))].map(k=>['Tahun '+k,ss.filter(s=>s.tahun===k),subs]))}${table('Mengikut subjek',subs.map(s=>[s,ss,[s]]))}</div><p><button id="print">Cetak / Simpan PDF (landskap)</button></p>`;$('print').onclick=()=>printPart('report',true);}
function individual(){const ex=$('exam').value,ss=chosen().sort((a,b)=>{const x=score(a.id,ex),y=score(b.id,ex);return Number(y.complete)-Number(x.complete)||y.total-x.total;});$('view').innerHTML=`<div id="report">${heading('Analisis Individu')}<p>Peratus = jumlah markah ÷ (${data.subjects.length} × 70) × 100. Kedudukan akademik hanya untuk rekod lengkap tanpa TH.</p><div class="scroll"><table><tr><th>Nama</th><th>Kelas</th>${data.subjects.map(s=>`<th>${esc(s)}</th>`).join('')}<th>Jumlah</th><th>%</th><th>Ked. kelas</th>${grades.map(g=>`<th>${g}</th>`).join('')}</tr>${ss.map(s=>{const sc=score(s.id,ex),c=counts([s],data.subjects,ex);return `<tr><td class="name">${esc(s.name)}</td><td>${esc(s.kelas)}</td>${data.subjects.map(sub=>`<td>${esc(mark(s.id,ex,sub)||'—')}<br><small>${grade(mark(s.id,ex,sub))}</small></td>`).join('')}<td>${sc.total}</td><td>${sc.complete?sc.pct.toFixed(2):'Belum lengkap'}</td><td>${rank(s,ex,'kelas')}</td>${grades.map(g=>`<td>${c[g]}</td>`).join('')}</tr>`;}).join('')}</table></div>${ss.length===1?barChart(counts(ss,data.subjects,ex)):''}</div><p><button id="print">Cetak / Simpan PDF (landskap)</button></p>`;$('print').onclick=()=>printPart('report',true);}
function jawiSubject(s){if(data.jawi[s])return data.jawi[s];if(/[\u0600-\u06ff]/.test(s))return s;const n=s.toLowerCase().replace(/[^a-z]/g,'');const dict={alquran:'القرآن',quran:'القرآن',ibadat:'عبادت',ibadah:'عبادت',aqidah:'عقيدة',akidah:'عقيدة',tauhid:'توحيد',lughatulquran:'لغة القرآن',bahasaarab:'بهاس عرب',adab:'ادب',sirah:'سيره',jawi:'جاوي',khat:'خط',jawidankhat:'جاوي دان خط'};return dict[n]||s;}
function jawiExam(s){if(/[\u0600-\u06ff]/.test(s))return s;const n=s.toLowerCase();return n.includes('pertengahan')?'ڤڤريقساءن ڤرتڠهن تاهون':n.includes('akhir')?'ڤڤريقساءن اخير تاهون':'ڤڤريقساءن';}
function slipHTML(s,ex){const sc=score(s.id,ex),all=sc.complete&&data.subjects.every(sub=>Number(mark(s.id,ex,sub))>0),g=all?(sc.total/data.subjects.length>=53?'A':sc.total/data.subjects.length>=35?'B':sc.total/data.subjects.length>=17?'C':'D'):'—';return `<article class="slip"><img class="logo" src="https://iili.io/nqIgmR2.md.jpg" alt=""><h2>کافا النور</h2><h3>${jawiExam(ex)}</h3><div class="meta"><span>نام : <b>${esc(s.jawi||s.name)}</b></span></div><div class="meta"><span>تاهون : <bdi>${esc(s.tahun)}</bdi></span><span>کلس : <bdi>${esc(s.kelas)}</bdi></span><span>نومبور ڤڠنلن : <bdi>${esc(s.id.replace(/(\d{6})(\d{2})(\d{4})/,'$1-$2-$3'))}</bdi></span></div><table><thead><tr><th style="width:9%">بيل</th><th>مات ڤلاجرن</th><th style="width:17%">مرکه</th><th style="width:17%">ݢريد</th></tr></thead><tbody>${data.subjects.map((sub,i)=>`<tr><td>${i+1}</td><td style="text-align:right">${esc(jawiSubject(sub))}</td><td><bdi>${esc(mark(s.id,ex,sub)||'—')}</bdi></td><td><bdi>${['A','B','C','D','TH'].includes(grade(mark(s.id,ex,sub)))?grade(mark(s.id,ex,sub)):'—'}</bdi></td></tr>`).join('')}</tbody></table><table><tr><td>کدودوقن دالم کلس</td><td>${rank(s,ex,'kelas')}</td><td>جومله مرکه</td><td><bdi>${sc.total} / ${data.subjects.length*70}</bdi></td></tr><tr><td>کدودوقن دالم درجه</td><td>${rank(s,ex,'tahun')}</td><td>ڤراتوس</td><td>${sc.complete?sc.pct.toFixed(2)+'%':'—'}</td></tr><tr><td>کحاضيرن</td><td><bdi>${esc(mark(s.id,ex,'','kehadiran')||'—')}</bdi></td><td>ݢريد</td><td>${g}</td></tr></table><h3><u>اولسن ݢورو</u></h3><div class="comment">${esc(mark(s.id,ex,'','ulasan'))}</div><div class="signs"><div>تندا تاڠن<br>ڤنجاݢ</div><div>تندا تاڠن ݢورو</div><div>تندا تاڠن<br>ݢورو بسر</div></div></article>`;}
function slips(){const ex=$('exam').value,ss=chosen();$('view').innerHTML=`<h2>Slip Pencapaian Jawi</h2><p><button id="print">Cetak / Simpan PDF A4</button></p><div id="slips" class="slipwrap">${ss.map(s=>slipHTML(s,ex)).join('')}</div>`;$('print').onclick=()=>printPart('slips',false);}
async function printPart(id,landscape){$('pageRule').textContent=`@page{size:A4 ${landscape?'landscape':'portrait'};margin:10mm}`;$('printArea').innerHTML=$(id).innerHTML;await document.fonts.ready;await Promise.all([...$('printArea').querySelectorAll('img')].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r;setTimeout(r,5000);})));window.print();}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
</script></body></html>
